# 评测任务目录（手工维护）。slug 全站唯一，小写连字符。
# primary_metric 用于排行（两两对决）；其余指标仅展示。
# access: open | registration | dua | application
# ⚠ 种子数据：待 research/benchmarks_catalog.json 到位后核对补全。
- slug: tuab
  name: TUAB
  full_name: TUH Abnormal EEG Corpus (v3.0.1)
  task_family: abnormal_detection
  modality: EEG
  n_classes: 2
  primary_metric: balanced_accuracy
  metrics: [balanced_accuracy, auc_pr, auroc]
  higher_is_better: true
  n_subjects: 2383
  hours: 1142
  n_channels: 16
  sfreq_hz: 200
  epoch_seconds: 10
  standard_split: 官方 train/eval 划分；BIOT/LaBraM 协议再从 train 按受试者切 80/20 做 val
  preprocessing: 0.1–75 Hz 带通，50 Hz 陷波，重采样 200 Hz，单位 0.1 mV，16 个双极/单极通道
  access: dua
  license: TUH EEG Corpus Data Use Agreement（需签署申请表，禁止再分发）
  url: https://isip.piconepress.com/projects/nedc/html/tuh_eeg/
- slug: tuev
  name: TUEV
  full_name: TUH EEG Events Corpus (v2.0.1)
  task_family: event_classification
  modality: EEG
  n_classes: 6
  primary_metric: balanced_accuracy
  metrics: [balanced_accuracy, cohen_kappa, weighted_f1]
  higher_is_better: true
  n_subjects: 370
  hours: 112
  n_channels: 16
  sfreq_hz: 200
  epoch_seconds: 5
  standard_split: 官方 train/eval 划分；train 再按受试者切 80/20 做 val（BIOT/LaBraM 协议）
  preprocessing: 同 TUAB；6 类：SPSW / GPED / PLED / EYEM / ARTF / BCKG
  access: dua
  license: TUH EEG Corpus Data Use Agreement
  url: https://isip.piconepress.com/projects/nedc/html/tuh_eeg/
